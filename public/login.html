<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Amih Laundry</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: "Segoe UI", Arial, sans-serif;
  color: #24435f;
  background: linear-gradient(135deg, #eaf4ff 0%, #f7fbff 52%, #e4f1ff 100%);
}

.login-wrapper {
  width: 100%;
  max-width: 430px;
}

.login-card {
  width: 100%;
  padding: 38px 34px 32px;
  background: #fff;
  border: 1px solid #e3edf7;
  border-radius: 22px;
  box-shadow: 0 18px 55px rgba(35, 93, 145, .12);
}

/* LOGO DAN BRAND */
.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand-logo {
  width: 108px;
  height: 108px;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border-radius: 22px;
}

.brand-logo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.brand h1 {
  margin: 0;
  color: #0754a5;
  font-size: 30px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.brand p {
  margin: 7px 0 0;
  color: #7890a8;
  font-size: 14px;
}

/* JUDUL LOGIN */
.welcome {
  margin: 0;
  color: #174f83;
  text-align: center;
  font-size: 24px;
  font-weight: 700;
}

.subtitle {
  margin: 8px 0 25px;
  color: #8194a8;
  text-align: center;
  font-size: 14px;
}

/* INPUT */
.field {
  position: relative;
  margin-bottom: 17px;
}

.field > i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #6c8aa7;
  font-size: 19px;
}

.field input {
  width: 100%;
  height: 54px;
  padding: 0 52px 0 48px;
  border: 1px solid #d8e4ef;
  border-radius: 11px;
  outline: none;
  background: #fbfdff;
  color: #243f58;
  font: inherit;
  font-size: 15px;
  transition: border-color .2s, box-shadow .2s;
}

.field input:focus {
  border-color: #2786df;
  box-shadow: 0 0 0 4px rgba(39, 134, 223, .11);
  background: #fff;
}

.field input::placeholder {
  color: #9aabba;
}

/* TOMBOL LIHAT PASSWORD */
.toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  padding: 5px;
  background: transparent;
  color: #6c8aa7;
  font-size: 19px;
  cursor: pointer;
}

/* INGAT SAYA */
.options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 5px 0 22px;
  color: #526f8a;
  font-size: 13px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.remember input {
  accent-color: #197bd5;
  width: 16px;
  height: 16px;
}

a {
  color: #1477cf;
  text-decoration: none;
  font-weight: 600;
}

a:hover {
  text-decoration: underline;
}

/* TOMBOL MASUK */
.btn-login {
  width: 100%;
  min-height: 54px;
  border: 0;
  border-radius: 11px;
  background: linear-gradient(135deg, #2789e8, #1372d1);
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(28, 123, 213, .22);
  transition: transform .2s, box-shadow .2s;
}

.btn-login:hover {
  transform: translateY(-1px);
  box-shadow: 0 11px 22px rgba(28, 123, 213, .28);
}

.btn-login:disabled {
  opacity: .7;
  cursor: wait;
}

#errorMessage {
  margin-bottom: 15px;
  border-radius: 9px;
  font-size: 13px;
}

/* HUBUNGI ADMIN */
.contact {
  margin: 22px 0 0;
  color: #8295a8;
  text-align: center;
  font-size: 13px;
}

/* RESPONSIVE HP */
@media (max-width: 480px) {
  body {
    padding: 16px;
  }

  .login-card {
    padding: 30px 22px 26px;
    border-radius: 18px;
  }

  .brand-logo {
    width: 92px;
    height: 92px;
  }

  .brand h1 {
    font-size: 27px;
  }

  .welcome {
    font-size: 22px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="login-wrapper">
  <section class="login-card">

    <header class="brand">
      <div class="brand-logo">
        <img src="/logo-amih-laundry.png" alt="Logo Amih Laundry">
      </div>

      <h1>Amih Laundry</h1>
      <p>Bersih · Rapi · Terpercaya</p>
    </header>

    <h2 class="welcome">Selamat Datang!</h2>
    <p class="subtitle">Silakan masuk untuk melanjutkan</p>

    <form id="formLogin">

      <div class="field">
        <i class="bi bi-person"></i>
        <input
          type="text"
          id="username"
          placeholder="Username"
          required
          autocomplete="username"
        >
      </div>

      <div class="field">
        <i class="bi bi-lock"></i>
        <input
          type="password"
          id="password"
          placeholder="Password"
          required
          autocomplete="current-password"
        >

        <button
          type="button"
          class="toggle"
          id="togglePassword"
          aria-label="Tampilkan password"
        >
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <div id="errorMessage"
           class="alert alert-danger d-none"
           role="alert"></div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          <span>Ingat saya</span>
        </label>

        <a href="#" id="forgotPassword">Lupa password?</a>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <i class="bi bi-box-arrow-in-right"></i>
        &nbsp;Masuk
      </button>

    </form>

    <p class="contact">
      Belum punya akun?
      <a href="#" id="contactAdmin">Hubungi Admin</a>
    </p>

  </section>
</main>

<script>
const form = document.getElementById("formLogin");
const errorBox = document.getElementById("errorMessage");
const btnLogin = document.getElementById("btnLogin");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");

/* TAMPILKAN PASSWORD */
document.getElementById("togglePassword")
.addEventListener("click", function() {
  const icon = this.querySelector("i");
  const showing = passwordInput.type === "password";

  passwordInput.type = showing ? "text" : "password";
  icon.className = showing
    ? "bi bi-eye-slash"
    : "bi bi-eye";
});

/* INGAT USERNAME */
const remembered = localStorage.getItem("remember_username");

if (remembered) {
  usernameInput.value = remembered;
  document.getElementById("rememberMe").checked = true;
}

/* PROSES LOGIN ASLI */
form.addEventListener("submit", async function(e) {
  e.preventDefault();

  errorBox.classList.add("d-none");
  btnLogin.disabled = true;
  btnLogin.innerHTML = "Memproses...";

  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  try {
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      errorBox.textContent =
        data.message || "Username atau password salah";

      errorBox.classList.remove("d-none");
      btnLogin.disabled = false;
      btnLogin.innerHTML =
        '<i class="bi bi-box-arrow-in-right"></i> &nbsp;Masuk';

      return;
    }

    localStorage.setItem("token", data.data.token);
    localStorage.setItem("user", JSON.stringify(data.data.user));

    if (document.getElementById("rememberMe").checked) {
      localStorage.setItem("remember_username", username);
    } else {
      localStorage.removeItem("remember_username");
    }

    const role = data.data.user.role;

    if (role === "CUSTOMER") {
      window.location.href = "dashboard-customer.html";
      return;
    }

    const destinations = {
      KASIR: "dashboard-kasir.html",
      ADMIN: "dashboard-admin.html",
      OWNER: "dashboard-owner.html",
      STAFF_LAUNDRY: "dashboard-staff.html"
    };

    if (destinations[role]) {
      window.location.href = destinations[role];
    } else {
      errorBox.textContent = "Role tidak dikenali";
      errorBox.classList.remove("d-none");

      btnLogin.disabled = false;
      btnLogin.innerHTML =
        '<i class="bi bi-box-arrow-in-right"></i> &nbsp;Masuk';
    }

  } catch (error) {
    console.error(error);

    errorBox.textContent = "Tidak dapat terhubung ke server";
    errorBox.classList.remove("d-none");

    btnLogin.disabled = false;
    btnLogin.innerHTML =
      '<i class="bi bi-box-arrow-in-right"></i> &nbsp;Masuk';
  }
});

/* LUPA PASSWORD */
document.getElementById("forgotPassword")
.addEventListener("click", function(e) {
  e.preventDefault();
  alert("Untuk reset password, silakan hubungi Admin Amih Laundry.");
});

/* HUBUNGI ADMIN */
document.getElementById("contactAdmin")
.addEventListener("click", function(e) {
  e.preventDefault();
  alert("Silakan hubungi Admin Amih Laundry untuk membuat akun.");
});
</script>

</body>
</html>
